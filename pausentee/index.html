<style>
:root{
  --red:#e2001a; --red-dark:#b30015; --red-soft:#fdecee;
  --ink:#1c1c1e; --muted:#6e6e73; --line:#e9e5e1; --bg:#f5f3f0; --card:#fff;
  --ok:#1f8a4c; --ok-soft:#e6f4ec; --no:#9a9aa0; --gold:#c99a06;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block}
a{color:var(--red)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 110px}

/* Kopf mit Brustring */
.top{background:#fff;padding-top:env(safe-area-inset-top)}
.ring{background:var(--red);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;margin-top:14px;box-shadow:0 2px 0 var(--red-dark)}
.ring .crest{width:44px;height:44px;background:#fff;border-radius:50%;padding:4px;flex:none}
.ring h1{margin:0;font-size:24px;letter-spacing:.5px;font-weight:800;line-height:1}
.ring small{display:block;font-size:12px;opacity:.9;margin-top:3px;letter-spacing:.3px}
.ring .grow{flex:1;min-width:0}
.ring .comp{width:40px;height:40px;background:#fff;border-radius:10px;padding:4px;flex:none;object-fit:contain}
.top .sub{height:14px}

h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 4px 8px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.hl{border:2px solid var(--red)}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Spielkarte */
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.meta img{width:22px;height:22px;object-fit:contain}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0 6px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.team img{width:56px;height:56px;object-fit:contain}
.team span{font-weight:650;font-size:14px;line-height:1.2}
.score{font-size:34px;font-weight:800;letter-spacing:1px;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.vs{font-size:15px;color:var(--muted);font-weight:700;text-align:center;min-width:80px}
.cd{text-align:center;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;margin-top:6px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:800;font-size:13px;letter-spacing:.5px}
.live:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* Tippen */
.tip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:14px}
.step{display:flex;align-items:center;justify-content:center;gap:6px}
.step button{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);font-size:24px;font-weight:700;line-height:1}
.step button:active{background:var(--line)}
.step b{font-size:30px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.colon{font-size:26px;font-weight:800;color:var(--muted)}
.tipstate{text-align:center;font-size:13px;margin-top:8px;min-height:18px}
.tipstate.ok{color:var(--ok)}
.joker{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;border:1.5px dashed var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:650}
.joker.on{border:1.5px solid var(--gold);background:#fff8e1;color:#7a5c00}
.joker[disabled]{opacity:.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--red);color:#fff;width:100%}
.btn.sec{background:var(--bg);color:var(--ink)}
.btn.wa{background:#25d366;color:#fff}
.btn.small{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5}
.who{font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

/* Kompakte Spielzeilen */
.mrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}

.mrow .cl{width:18px;height:18px;object-fit:contain;flex:none;opacity:.9}
.mrow .res{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.red{background:var(--red);color:#fff}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.gold{background:#fff3c4;color:#7a5c00}
.mini{display:flex;align-items:center;gap:4px}
.mini button{width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);font-size:18px;font-weight:700;line-height:1;padding:0}
.mini b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
details.m summary{list-style:none;cursor:pointer}
details.m summary::-webkit-details-marker{display:none}
.tips{margin:6px 0 4px;font-size:14px}
.tips .t{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--bg);color:var(--no);font-weight:650}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.j{background:#fff3c4;color:#7a5c00}
.chip.sum{background:var(--ink);color:#fff}

/* Tabelle */
table{width:100%;border-collapse:collapse}
.rank td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:middle}
.rank tr:first-child td{border-top:0}
.rank .pl{width:28px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.rank .ar{width:18px;text-align:center;font-size:12px;font-weight:800}
.ar.up{color:var(--ok)} .ar.down{color:var(--red)} .ar.eq{color:#c7c7cc}
.rank .pts{text-align:right;font-weight:800;font-size:18px;width:46px;font-variant-numeric:tabular-nums}
.rank .ex{text-align:right;width:38px;color:var(--muted);font-size:13px}
.rank tr.me td{background:var(--red-soft)}
.rank tr.me td:first-child{border-radius:10px 0 0 10px}
.rank tr.me td:last-child{border-radius:0 10px 10px 0}
.nm{font-weight:700}
.vn{font-size:12px;color:var(--muted)}
.last{font-size:12px;color:var(--muted);margin-top:2px}
.badges{margin-left:4px}

.league td{padding:7px 4px;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.league th{font-size:11px;color:var(--muted);text-align:right;padding:0 4px 6px;font-weight:700}
.league th:nth-child(2){text-align:left}
.league td.n{text-align:right;width:34px}
.league td.p{width:30px;text-align:center;font-weight:700;border-left:4px solid transparent}
.league img{width:22px;height:22px;object-fit:contain}
.league tr.vfb td{background:var(--red-soft);font-weight:800}
.chipsel{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chipsel button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:650;white-space:nowrap}
.chipsel button.on{border-color:var(--red);color:var(--red)}
.chipsel img{width:18px;height:18px;object-fit:contain}

/* Spieler */
.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pbtn{position:relative;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 10px 10px 12px;font-size:14px;font-weight:650;line-height:1.2}
.pbtn small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.pbtn.sel{border-color:var(--red);background:var(--red-soft)}
.pbtn .badge{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* Anmeldung */
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff}
.legends{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.leg{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-weight:650;font-size:14px;line-height:1.2}
.leg small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.leg.taken{background:var(--bg);color:var(--muted)}
input.f{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;background:#fff;margin-top:6px}
label.l{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:14px}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:650;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--red)}
nav.tabs button.on span{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:15px}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.opt .bar{height:8px;border-radius:4px;background:var(--bg);position:relative;margin-top:4px}
.opt .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
ul.rules{padding-left:20px;margin:6px 0}
ul.rules li{margin:5px 0}
.adm input{width:56px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:16px;text-align:center}
</style>
</head>

function cacheObj(m){ return {t: m.t, tv: m.timeValid ? 1 : 0, c: m.comp, r: m.round || '', v: m.venue || '', ci: m.city || '', h: {id: m.home.id, n: m.home.name, l: m.home.logo || ''}, a: {id: m.away.id, n: m.away.name, l: m.away.logo || ''}}; }
function fromCache(id, c){ return {id, t: c.t, timeValid: !!c.tv, comp: c.c, round: c.r, venue: c.v, city: c.ci, home: {id: c.h.id, name: c.h.n, logo: c.h.l}, away: {id: c.a.id, name: c.a.n, logo: c.a.l}, vfbHome: c.h.id === VFB, state: c.t < now() ? 'post' : 'pre', completed: false, hs: null, as: null, cached: true}; }
function syncCache(){
  if (!db || dbError || !dataReady) return;
  const upd = {}, cache = D.spiele || {};
  for (const m of Object.values(M)) {
    if (m.t < START) continue;
    const o = cacheObj(m);
    if (stable(cache[m.id]) !== stable(o)) upd['spiele/' + m.id] = o;
  }
  if (Object.keys(upd).length) db.ref(ROOT).update(upd).catch(() => {});
  syncResults();
}
function syncResults(){
  if (!db || dbError || !dataReady) return;
  const upd = {};
  for (const m of matches()) {
    if (m.t < START || !m.completed || m.hs == null || m.as == null) continue;
    const r = (D.results || {})[m.id];
    if (r && r.src === 'manual') continue;
    if (!r || r.h !== m.hs || r.a !== m.as) upd['results/' + m.id] = {h: m.hs, a: m.as, src: 'auto', at: firebase.database.ServerValue.TIMESTAMP};
  }
  if (Object.keys(upd).length) db.ref(ROOT).update(upd).catch(() => {});
}
function matches(){
  const all = {};
  for (const [id, c] of Object.entries(D.spiele || {})) if (c && c.h && c.a) all[id] = fromCache(id, c);
  for (const [id, m] of Object.entries(M)) all[id] = {...m};
  for (const [id, l] of Object.entries(live)) if (all[id]) Object.assign(all[id], Object.fromEntries(Object.entries(l).filter(([k, v]) => v != null)));
  return Object.values(all).sort((a, b) => a.t - b.t);
}
const counted = () => matches().filter(m => m.t >= START && !/POSTPONED|CANCEL/.test(m.sname || ''));
function result(m){
  const r = (D.results || {})[m.id];
  if (r && r.h != null && r.a != null) return {h: +r.h, a: +r.a, src: r.src};
  if (m.completed && m.hs != null && m.as != null) return {h: m.hs, a: m.as, src: 'espn'};
  return null;
}
const isLive = m => !result(m) && (m.state === 'in' || (now() >= m.t && now() < m.t + 3.5 * 3600e3 && m.state !== 'post' && !/POSTPONED|CANCEL/.test(m.sname || '')));
const opp = m => m.vfbHome ? m.away : m.home;

/* =========================================================
   PUNKTE
   ========================================================= */
function points(tip, r, m){
  const td = tip.h - tip.a, rd = r.h - r.a;
  const ten = Math.sign(td) === Math.sign(rd), diff = td === rd, hg = tip.h === r.h, ag = tip.a === r.a;
  const vfbG = m.vfbHome ? hg : ag, oppG = m.vfbHome ? ag : hg;
  return {ten, diff, vfbG, oppG, exact: hg && ag, base: (ten ? 2 : 0) + (diff ? 1 : 0) + (hg ? 1 : 0) + (ag ? 1 : 0)};
}
const users = () => Object.entries(D.users || {}).filter(([k, u]) => u && u.name).map(([k, u]) => ({k, ...u}));
const uName = k => ((D.users || {})[k] || {}).name || '?';
const tipOf = (mid, k) => ((D.tips || {})[mid] || {})[k] || null;
function validTip(m, k){
  const t = tipOf(m.id, k);
  if (!t || t.h == null || t.a == null) return null;
  if (t.at && t.at > m.t + 120e3) return null;
  return t;
}
const halfOf = t => { const d = new Date(t); const y = d.getUTCFullYear(), mo = d.getUTCMonth(); return mo >= 6 ? y + '-H' : (y - 1) + '-R'; };
const halfName = t => halfOf(t).endsWith('H') ? 'Hinrunde' : 'Rückrunde';
function rankOf(list, tot, ex){
  const arr = list.map(u => u.k).sort((a, b) => (tot[b] - tot[a]) || (ex[b] - ex[a]) || uName(a).localeCompare(uName(b), 'de'));
  const rk = {}; arr.forEach((k, i) => { const p = arr[i - 1]; rk[k] = (i > 0 && tot[p] === tot[k] && ex[p] === ex[k]) ? rk[p] : i + 1; });
  return {order: arr, rk};
}
function evaluate(){
  const us = users(), tot = {}, ex = {}, hist = [];
  us.forEach(u => { tot[u.k] = 0; ex[u.k] = 0; });
  for (const m of counted()) {
    const r = result(m); if (!r) continue;
    const part = us.filter(u => !u.joinedAt || u.joinedAt <= m.t + 120e3);
    const per = {};
    for (const u of part) {
      const tip = validTip(m, u.k); let p = 0, b = null;
      if (tip) { b = points(tip, r, m); p = b.base * (tip.j ? 2 : 1); if (b.exact) ex[u.k]++; }
      tot[u.k] += p; per[u.k] = {p, b, tip};
    }
    hist.push({m, r, per, tot: {...tot}, ex: {...ex}, ...rankOf(part, tot, ex)});
  }
  const cur = rankOf(us, tot, ex);
  const last = hist[hist.length - 1], prev = hist[hist.length - 2];
  const king = [], gurke = [];
  if (last) {
    const vals = Object.values(last.per).map(x => x.p);
    const mx = Math.max(...vals), mn = Math.min(...vals);
    if (vals.length > 1 && mx !== mn) for (const [k, x] of Object.entries(last.per)) { if (x.p === mx) king.push(k); if (x.p === mn) gurke.push(k); }
  }
  const lastRank = cur.order.length ? cur.rk[cur.order[cur.order.length - 1]] : 0;
  const lantern = (hist.length && cur.order.length > 1 && lastRank > 1) ? cur.order.filter(k => cur.rk[k] === lastRank) : [];
  const move = {};
  if (last && prev) for (const k of cur.order) if (prev.rk[k] && last.rk[k]) move[k] = prev.rk[k] - last.rk[k];
  return {us, tot, ex, hist, cur, last, king, gurke, lantern, move};
}

   ========================================================= */
const draft = {};
function myTip(mid){ return draft[mid] || tipOf(mid, me); }
function stepTip(m, side, d){
  if (now() >= m.t) { toast('Anpfiff war schon, Tipp gesperrt'); return; }
  const cur = myTip(m.id) || {};
  let h = cur.h, a = cur.a;
  if (h == null || a == null) { h = h ?? 0; a = a ?? 0; }
  if (side === 'h') h = Math.max(0, Math.min(15, h + d)); else a = Math.max(0, Math.min(15, a + d));
  draft[m.id] = {h, a, j: !!cur.j};
  saveTip(m);
  render();
}
function saveTip(m){
  clearTimeout(saveTip['_' + m.id]);
  saveTip['_' + m.id] = setTimeout(async () => {
    const t = draft[m.id]; if (!t) return;
    if (now() >= m.t) { delete draft[m.id]; toast('Zu spät, Anpfiff war schon'); render(); return; }
    try { await db.ref(`${ROOT}/tips/${m.id}/${me}`).set({h: t.h, a: t.a, j: !!t.j, at: firebase.database.ServerValue.TIMESTAMP}); delete draft[m.id]; }
    catch (e) { toast('Tipp nicht gespeichert: ' + e.message); }
    render();
  }, 450);
}
function jokerElsewhere(m){
  for (const [mid, by] of Object.entries(D.tips || {})) {
    if (mid === m.id || !by || !by[me] || !by[me].j) continue;
    const o = matches().find(x => x.id === mid);
    if (o && o.t >= START && halfOf(o.t) === halfOf(m.t)) return o;
  }
  return null;
}
async function toggleJoker(m){
  if (now() >= m.t) return;
  const t = myTip(m.id);
  if (!t || t.h == null) { toast('Erst tippen, dann Joker setzen'); return; }
  const other = jokerElsewhere(m);
  if (!t.j && other && other.t <= now()) { toast(`Joker der ${halfName(m.t)} schon gegen ${opp(other).name} eingesetzt`); return; }
  const upd = {};
  if (!t.j && other) upd[`tips/${other.id}/${me}/j`] = false;
  upd[`tips/${m.id}/${me}`] = {h: t.h, a: t.a, j: !t.j, at: firebase.database.ServerValue.TIMESTAMP};
  delete draft[m.id];
  try { await db.ref(ROOT).update(upd); toast(!t.j ? (other ? `Joker verschoben, vorher gegen ${opp(other).name}` : 'Joker gesetzt: doppelte Punkte') : 'Joker zurückgenommen'); }
  catch (e) { toast('Fehler: ' + e.message); }
}

    else for (const g of st.groups) {
      h += `<h2>${esc(g.name.replace(/^\d{4}-\d{2}\s*/, '').replace('League Phase', 'Ligaphase').replace('German Bundesliga', 'Tabelle'))}</h2><div class="card" style="padding:10px 8px"><table class="league">
        <tr><th></th><th>Verein</th><th>Sp</th><th>TD</th><th>Pkt</th></tr>
        ${g.entries.map(e => `<tr class="${e.id === VFB ? 'vfb' : ''}"><td class="p" style="border-left-color:${e.color || 'transparent'}">${e.rank}</td>
          <td><div class="row" style="gap:8px"><img src="${esc(e.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="ell">${esc(e.name)}</span></div></td>
          <td class="n">${esc(e.gp)}</td><td class="n">${esc(e.gd)}</td><td class="n"><b>${esc(e.pts)}</b></td></tr>`).join('')}
      </table></div>`;
    }
  }
  const played = cm.filter(m => result(m) || (m.completed && m.hs != null)).reverse();
  if (played.length) h += `<h2>VfB in diesem Wettbewerb</h2><div class="card" style="padding-top:4px;padding-bottom:4px">${played.map(m => { const r = result(m) || {h: m.hs, a: m.as}; return `<div class="mrow"><img class="lg" src="${esc(opp(m).logo)}" alt="" loading="lazy"><div class="grow"><b class="ell">${m.vfbHome ? 'gegen' : 'bei'} ${esc(opp(m).name)}</b><div class="small muted">${m.round ? esc(m.round) + ' · ' : ''}${esc(fmtDay(m.t))}</div></div><span class="res">${r.h}:${r.a}</span></div>`; }).join('')}</div>`;
  return h;
}

/* ---------- Reiter Mehr ---------- */
function vMehr(){
  const u = D.users[me] || {};
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<h2>Du</h2><div class="card"><div class="row between"><div><b style="font-size:18px">${esc(u.name)}</b>${u.vorname ? `<div class="muted small">${esc(u.vorname)}</div>` : ''}</div><button class="btn sec small" id="logout">Abmelden</button></div></div>
  <h2>Regeln</h2><div class="card"><ul class="rules">
    <li>Jeder tippt das Ergebnis, zum Beispiel 2:1. Getippt wird bis zum Anpfiff, danach ist gesperrt.</li>
    <li><b>Punkte:</b> Tendenz 2, Tordifferenz 1, VfB-Tore 1, Gegentore 1. Das exakte Ergebnis bringt damit 5 Punkte.</li>
    <li><b>Joker:</b> Einmal pro Hinrunde (bis Dezember) und einmal pro Rückrunde (ab Januar) zählt ein Spiel doppelt. Bis zum Anpfiff lässt er sich verschieben.</li>
    <li>Die Tipps der anderen siehst du erst ab Anpfiff.</li>
    <li>Es zählt der Endstand nach Verlängerung, ein Elfmeterschießen zählt nicht.</li>
    <li>Bei Punktgleichheit liegt vorne, wer öfter exakt getippt hat.</li>
    <li>👑 König und 🥒 Gurke des Spieltags: die meisten und die wenigsten Punkte im letzten Spiel. 🏮 Rote Laterne: Letzter der Gesamtwertung.</li>
    <li>Wer später einsteigt, startet bei 0.</li>
    <li><b>Spieler der Saison:</b> Nach Abpfiff wählt jeder bis zum nächsten Anpfiff seine Top 3 des Spiels (3, 2 und 1 Punkt).</li>
    <li>Bundesliga, DFB-Pokal und Europapokal zählen, Testspiele nicht.</li>
  </ul></div>
  <h2>Als App aufs Handy</h2><div class="card small">${ios ? 'In Safari unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.' : 'Im Browser-Menü (drei Punkte) <b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b> wählen.'} Dann startet der Pausentee wie eine App.</div>
  <h2>Link für neue Mitspieler</h2><div class="card"><div class="small muted ell">${esc(location.origin + location.pathname)}</div>
    <button class="btn wa small" style="margin-top:10px" id="invite">💬 Per WhatsApp einladen</button></div>
  <div class="center" style="margin-top:26px"><button class="btn sec small" id="toAdmin">Admin</button></div>
  <div class="center small muted" style="margin-top:12px">Daten: ESPN · Wappen und Logos gehören den Vereinen und Verbänden</div>`;
}

/* =========================================================
   EREIGNISSE
   ========================================================= */
function bind(main, ms, E){
  main.querySelectorAll('[data-s]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); const [id, side, d] = b.dataset.s.split('|'); const m = ms.find(x => x.id === id); if (m) stepTip(m, side, +d); });
  main.querySelectorAll('[data-j]').forEach(b => b.onclick = () => { const m = ms.find(x => x.id === b.dataset.j); if (m) toggleJoker(m); });
  main.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
    const m = ms.find(x => x.id === b.dataset.wa); if (!m) return;
    const open = users().filter(u => !tipOf(m.id, u.k)).map(u => u.name);
    const txt = `☕ Pausentee: ${m.home.name} gegen ${m.away.name}, ${fmtWhen(m)}.\nNoch nicht getippt: ${open.join(', ')}.\nJetzt tippen: ${location.origin + location.pathname}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
  });
  const mu = $('#moreUp', main); if (mu) mu.onclick = () => { showAllUpcoming = !showAllUpcoming; render(); };
  main.querySelectorAll('tr[data-u]').forEach(tr => tr.onclick = () => { const d = tr.querySelector('.ubd'); if (d && d.innerHTML.trim()) { d.hidden = !d.hidden; d.hidden ? openU.delete(tr.dataset.u) : openU.add(tr.dataset.u); } });
  main.querySelectorAll('details[data-d]').forEach(d => d.ontoggle = () => d.open ? openD.add(d.dataset.d) : openD.delete(d.dataset.d));
  main.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { compSel = b.dataset.c; render(); });
  main.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const [mid, pid] = b.dataset.p.split('|'); const sel = voteDraft[mid] || (voteDraft[mid] = []);
    const i = sel.indexOf(pid); if (i >= 0) sel.splice(i, 1); else if (sel.length < 3) sel.push(pid); else toast('Drei sind gewählt. Tippe einen an, um ihn abzuwählen.');
    render();
  });
  const vg = $('#voteGo', main); if (vg) vg.onclick = async () => {
    const mid = vg.dataset.m, pl = players[mid] || [], sel = voteDraft[mid] || [];
    if (sel.length !== 3) return;
    const p = sel.map(id => { const x = pl.find(q => q.id === id); return {id, n: x ? x.n : id}; });
    try { await db.ref(`${ROOT}/votes/${mid}/${me}`).set({p, at: firebase.database.ServerValue.TIMESTAMP}); delete voteDraft[mid]; toast('Abgegeben'); } catch (e) { toast('Fehler: ' + e.message); }
  };
  const rv = $('#revote', main); if (rv) rv.onclick = async () => { const vm = voteMatch(); if (!vm) return; const mine = ((D.votes || {})[vm.m.id] || {})[me]; voteDraft[vm.m.id] = mine ? mine.p.map(p => p.id) : []; await db.ref(`${ROOT}/votes/${vm.m.id}/${me}`).remove(); };
  const lo = $('#logout', main); if (lo) lo.onclick = () => { me = null; localStorage.removeItem('pausentee-me'); view = 'login'; renderLogin(); };
  const inv = $('#invite', main); if (inv) inv.onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(`☕ Tippt mit beim Pausentee, unserer VfB-Tipprunde! Such dir deine VfB-Legende aus: ${location.origin + location.pathname}`), '_blank');
  const ta = $('#toAdmin', main); if (ta) ta.onclick = () => { view = 'admin'; renderAdmin(); };
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { view = b.dataset.v; localStorage.setItem('pausentee-view', view); window.scrollTo(0, 0); render(); });
function tickCountdowns(){ document.querySelectorAll('[data-cd]').forEach(el => { const t = +el.dataset.cd; el.textContent = t > now() ? cdText(t) : 'Angepfiffen, Tipps gesperrt'; }); }

/* =========================================================
   ADMIN (Notfall-Knopf)
   ========================================================= */
async function renderAdmin(){
  $('#nav').hidden = false;
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('on'));
  const main = $('#main');
  const cfg = D.config || {};
  if (!adminOk) {
    main.innerHTML = `<h2>Admin</h2><div class="card">
      <p class="small muted" style="margin-top:0">${cfg.admin ? 'Admin-Code eingeben.' : 'Noch kein Admin-Code festgelegt. Wer ihn jetzt festlegt, ist Admin.'}</p>
      <input class="f" id="acode" type="password" inputmode="numeric" autocomplete="off" placeholder="Code">
      <div class="err" id="aerr"></div><button class="btn" id="ago">${cfg.admin ? 'Öffnen' : 'Code festlegen'}</button>
      <button class="btn sec" style="margin-top:8px" id="aback">Zurück</button></div>`;
    $('#aback').onclick = () => { view = 'mehr'; render(); };
    $('#ago').onclick = async () => {
      const c = ($('#acode').value || '').trim(); if (c.length < 4) { $('#aerr').textContent = 'Mindestens vier Zeichen.'; return; }
      const h = await sha('pausentee-admin|' + c);
      if (!cfg.admin) await db.ref(ROOT + '/config/admin').set(h);
      else if (cfg.admin !== h) { $('#aerr').textContent = 'Falscher Code.'; return; }
      adminOk = true; sessionStorage.setItem('pausentee-admin', '1'); renderAdmin();
    };
    return;
  }
  const past = counted().filter(m => m.t <= now()).reverse();
  main.innerHTML = `<h2>Ergebnisse (Notfall-Knopf)</h2><div class="card adm small">
    <p style="margin-top:0" class="muted">Normalerweise kommen die Ergebnisse von selbst. Falls nicht, hier eintragen. Ein von Hand eingetragenes Ergebnis hat Vorrang, „Automatik“ gibt wieder an ESPN ab.</p>
    ${past.length ? past.map(m => { const r = result(m); return `<div class="mrow" style="flex-wrap:wrap"><div class="grow"><b>${esc(m.home.name)} – ${esc(m.away.name)}</b><div class="muted">${esc(fmtDay(m.t))} · ${r ? r.h + ':' + r.a + ' (' + ({manual: 'von Hand', auto: 'automatisch', espn: 'ESPN'}[r.src] || r.src) + ')' : 'noch kein Ergebnis'}</div></div>
      <div class="row" style="gap:6px"><input id="h_${m.id}" inputmode="numeric" value="${r ? r.h : ''}"><b>:</b><input id="a_${m.id}" inputmode="numeric" value="${r ? r.a : ''}">
      <button class="btn small" data-save="${m.id}">Setzen</button>${r && r.src === 'manual' ? `<button class="btn sec small" data-auto="${m.id}">Automatik</button>` : ''}</div></div>`; }).join('') : '<div class="empty">Noch kein gewertetes Spiel angepfiffen.</div>'}
  </div>
  <h2>Teilnehmer</h2><div class="card adm small">${users().sort((a, b) => a.name.localeCompare(b.name, 'de')).map(u => `<div class="mrow"><div class="grow"><b>${esc(u.name)}</b>${u.vorname ? ' · ' + esc(u.vorname) : ''}<div class="muted">dabei seit ${u.joinedAt ? esc(fmtDay(u.joinedAt)) : '?'}${u.pin ? '' : ' · PIN zurückgesetzt'}</div></div>
    <button class="btn sec small" data-pin="${u.k}">PIN zurücksetzen</button><button class="btn sec small" data-del="${u.k}">Löschen</button></div>`).join('') || '<div class="empty">Noch niemand.</div>'}</div>
  <button class="btn sec" style="margin-top:12px" id="aout">Admin verlassen</button>`;
  main.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.dataset.save, h = parseInt($('#h_' + id).value, 10), a = parseInt($('#a_' + id).value, 10);
    if (!Number.isFinite(h) || !Number.isFinite(a) || h < 0 || a < 0) { toast('Bitte zwei Zahlen eintragen'); return; }
    await db.ref(`${ROOT}/results/${id}`).set({h, a, src: 'manual', at: firebase.database.ServerValue.TIMESTAMP}); toast('Ergebnis gesetzt'); renderAdmin();
  });
  main.querySelectorAll('[data-auto]').forEach(b => b.onclick = async () => { await db.ref(`${ROOT}/results/${b.dataset.auto}`).remove(); syncResults(); toast('Wieder automatisch'); setTimeout(renderAdmin, 400); });
  main.querySelectorAll('[data-pin]').forEach(b => b.onclick = async () => { await db.ref(`${ROOT}/users/${b.dataset.pin}/pin`).remove(); toast('PIN zurückgesetzt. Beim nächsten Anmelden wird eine neue gewählt.'); renderAdmin(); });
  main.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Wirklich löschen?'; b.style.background = 'var(--red)'; b.style.color = '#fff'; return; }
    const k = b.dataset.del, upd = {['users/' + k]: null};
    for (const mid of Object.keys(D.tips || {})) if (D.tips[mid] && D.tips[mid][k]) upd[`tips/${mid}/${k}`] = null;
    for (const mid of Object.keys(D.votes || {})) if (D.votes[mid] && D.votes[mid][k]) upd[`votes/${mid}/${k}`] = null;
    await db.ref(ROOT).update(upd); toast('Gelöscht'); renderAdmin();
  });
  $('#aout').onclick = () => { adminOk = false; sessionStorage.removeItem('pausentee-admin'); view = 'mehr'; render(); };
}

/* =========================================================
   TAKT
   ========================================================= */
setInterval(tickCountdowns, 1000);
let lastSched = 0;
setInterval(() => {
  if (document.hidden) return;
  const ms = matches();
  for (const m of ms) if (m.t >= START && !result(m) && now() >= m.t - 5 * 60e3 && now() < m.t + 4 * 3600e3) pollLive(m);
  if (now() - lastSched > 5 * 60e3) { lastSched = now(); refreshSchedule(); }
  else render();
}, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastSched = now(); refreshSchedule(); matches().filter(isLive).forEach(pollLive); } });

initDb();
lastSched = now();
refreshSchedule().then(() => matches().filter(m => m.t >= START && !result(m) && now() >= m.t - 5 * 60e3 && now() < m.t + 4 * 3600e3).forEach(pollLive));
</script>
