<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JGA Ferdi · Innsbruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Rubik:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: Hero mit Hüttenfoto, darunter Tab-Leiste und eine Spalte Inhalt (max 720px). Alpin: Tannengrün, Amber, Schnee. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#16231B; --muted:#5E6E63; --line:#D5DDD6; --soft:#E6ECE6;
  --pine:#1E5A3C; --pine-ink:#FFFFFF; --amber:#E6A117; --amber-ink:#1B1A14;
  --ok:#1E8A5A; --bad:#C23B3B; --a:#E2553E; --b:#2F6FED;
  --display:"Bricolage Grotesque","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121914; --surface:#1A231C; --ink:#EDF2EC; --muted:#9BAA9F; --line:#2B3A2F; --soft:#223027;
  --pine:#2E7A52; --amber:#F2B23A; --ok:#3FBF86; --bad:#E06060; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121914; --surface:#1A231C; --ink:#EDF2EC; --muted:#9BAA9F; --line:#2B3A2F; --soft:#223027;
  --pine:#2E7A52; --amber:#F2B23A; --ok:#3FBF86; --bad:#E06060; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,7vw,48px);font-weight:800}
h2{font-size:clamp(20px,4vw,26px);font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.hero{position:relative;min-height:230px;background:var(--pine);color:#fff;display:flex;align-items:flex-end;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(10,30,20,.75) 100%)}
.hero .in{position:relative;width:100%;max-width:720px;margin:0 auto;padding-block:28px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.hero .in .eyebrow{color:rgba(255,255,255,.8)}
.hero .count{font-family:var(--display);font-weight:800;font-size:15px;color:var(--amber)}
.tabs{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:720px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs .in::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:12px 4px 10px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 0 72px;white-space:nowrap}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--pine);border-bottom-color:var(--amber)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 160px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:90px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.notice{padding:10px 14px;border-radius:10px;background:var(--soft);font-size:14px}
.notice.err{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.edit-toggle{display:flex;justify-content:flex-end}

/* Zeitplan */
.day{display:flex;flex-direction:column;gap:10px}
.day h2{display:flex;align-items:baseline;gap:10px}
.day h2 span{font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted)}
.item{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-family:var(--display);font-weight:800;font-size:17px;color:var(--pine);font-variant-numeric:tabular-nums}
.item .t small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.item .title{font-weight:700}
.item .place{font-size:14px}
.item .place a{color:var(--pine);font-weight:500}
.item .note{font-size:14px;color:var(--muted);margin-top:2px}
.item.now{background:color-mix(in srgb,var(--amber) 14%,var(--surface));margin:0 -16px;padding-inline:16px;border-radius:10px;border-top:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:middle;margin-left:6px}
.editrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.editrow{grid-template-columns:1fr}}

/* Karte */
#map{height:min(70vh,520px);border-radius:14px;border:1px solid var(--line);background:var(--soft);z-index:0}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend .btn{font-size:14px}
.leaflet-container{font-family:var(--body)}

/* Turnier */
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.groups{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;width:34px}
tr.q td:first-child{font-weight:700}
tr.q td:first-child .nm::after{content:" ↑";color:var(--ok)}
.game{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.game:first-child{border-top:0}
.game .tm{min-width:0;overflow-wrap:anywhere}
.game .tm.w{font-weight:700}
.game .tm.r{text-align:right}
.game .sc{font-family:var(--display);font-weight:800;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.game .sc.open{background:color-mix(in srgb,var(--amber) 25%,var(--surface));color:var(--ink);font-size:13px;font-family:var(--body);font-weight:700}
.game .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.scoreform{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0 4px}
.scoreform input{text-align:center;font-family:var(--display);font-weight:800;font-size:22px}
.bracket{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.bracket{grid-template-columns:1fr}}
.champ{text-align:center;padding:18px;border-radius:14px;background:var(--pine);color:#fff}
.champ .name{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,34px)}
.teamedit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.teamedit:first-of-type{border-top:0}
.teamedit .no{grid-column:1/-1;font-family:var(--display);font-weight:800;font-size:15px}
.teamedit .no small{font-family:var(--body);font-weight:400;color:var(--muted)}
@media (max-width:560px){.teamedit{grid-template-columns:1fr}}

/* Quiz */
.live{border:2px solid var(--amber)}
.code{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.16em}

/* Bilder */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--soft)}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover}
.gallery figcaption{font-size:13px;padding:6px 8px}
.gallery .acts{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.gallery .acts .btn{padding:4px 8px;font-size:12px;background:rgba(255,255,255,.9);color:#16231B;border:0}
.gallery figure.hero-pick{outline:3px solid var(--amber)}
.infoblock h3{margin-bottom:4px}
.infoblock .txt{white-space:pre-wrap;font-size:15px}
.infoblock .txt a{color:var(--pine)}

/* Jetzt-Kachel */
.nowcard{background:var(--pine);color:#fff;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.nowcard .eyebrow{color:rgba(255,255,255,.75)}
.nowcard .big{font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,26px);line-height:1.1}
.nowcard .next{grid-column:1/-1;font-size:14px;color:rgba(255,255,255,.85);border-top:1px solid rgba(255,255,255,.2);padding-top:8px}
.nowcard .cd{font-family:var(--display);font-weight:800;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
/* Wetter */
.wx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx .d{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.wx .d .ic{font-size:28px;line-height:1}
.wx .d .t{font-family:var(--display);font-weight:800;font-size:18px}
.wx .d small{display:block;color:var(--muted);font-size:12px}
/* Ich-bin */
.me{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer}
/* Listen */
.check{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input[type=checkbox]{width:22px;height:22px;accent-color:var(--pine)}
.check.done .txt{text-decoration:line-through;color:var(--muted)}
.check .who{font-size:12px;color:var(--muted)}
/* Kasse */
.bal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.bal .pos{color:var(--ok);font-weight:700} .bal .neg{color:var(--bad);font-weight:700}
.settle{padding:8px 10px;border-radius:10px;background:var(--soft);font-size:15px}
/* Umfragen */
.poll .opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;position:relative;overflow:hidden}
.poll .opt .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--amber) 22%,transparent);z-index:0}
.poll .opt>*{position:relative}
.poll .opt.mine{border-color:var(--pine);font-weight:700}
/* Challenges */
.chal{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.chal:first-child{border-top:0}
.chal img{width:100%;max-width:220px;border-radius:10px;margin-top:6px}
.chal.done .txt{color:var(--muted);text-decoration:line-through}
/* Fotowand */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wall figure{margin:0;border-radius:12px;overflow:hidden;background:var(--soft)}
.wall img{width:100%;aspect-ratio:1;object-fit:cover}
.wall figcaption{font-size:12px;padding:5px 8px;color:var(--muted)}
.rank{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .pos{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank.top .pos{color:var(--pine)}
/* Wie lange noch */
.eta{background:var(--pine);color:#fff;border-radius:14px;padding:18px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.eta .km{font-family:var(--display);font-weight:800;font-size:clamp(44px,14vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.eta .km small{font-size:.4em;font-weight:700;opacity:.8}
.eta .sub{font-size:15px;opacity:.9}
.eta .arr{font-family:var(--display);font-weight:800;font-size:22px;color:var(--amber)}
.prog{height:14px;border-radius:7px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--amber);transition:width 1s}
.eta .lab{display:flex;justify-content:space-between;font-size:12px;opacity:.8}
.yn{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);text-align:center;padding:12px}
.train{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.train .b{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.train .b .v{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,30px);line-height:1.1;font-variant-numeric:tabular-nums}
.train .b.last .v{color:var(--bad)}
.train .b small{display:block;color:var(--muted);font-size:12px}
.train .b .gl{display:inline-block;max-width:100%;margin-top:5px;padding:1px 9px;border-radius:999px;background:var(--pine);color:#fff;font-size:12.5px;font-weight:700}
.train .b .gl.unk{white-space:nowrap;background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:600}
.taxi{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:15px}
.taxi a{color:var(--pine);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-decoration:none}
.taxi small{color:var(--muted);display:block;font-size:12px}
.feed{display:flex;flex-direction:column;gap:14px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph img{width:100%;max-height:70vh;object-fit:contain;background:#000}
.ph .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px}
.ph .by{font-weight:700}.ph .by small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.vote{display:flex;gap:8px}
.vote button{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.vote button span{font-size:15px;font-weight:700}
.vote button.on.up{background:color-mix(in srgb,var(--ok) 20%,var(--surface));border-color:var(--ok)}
.vote button.on.down{background:color-mix(in srgb,var(--bad) 18%,var(--surface));border-color:var(--bad)}
.top10{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.top10 figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:var(--soft);cursor:pointer}
.top10 img{width:100%;aspect-ratio:1;object-fit:cover}
.top10 .rk{position:absolute;top:4px;left:4px;background:var(--amber);color:var(--amber-ink);font-family:var(--display);font-weight:800;font-size:13px;padding:1px 7px;border-radius:999px}
.top10 figcaption{font-size:11px;padding:4px 6px;line-height:1.2}
.top10 figcaption strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-pick{display:flex;gap:6px;flex-wrap:wrap}
.chip-pick button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;cursor:pointer}
.chip-pick button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.seek{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.seek:first-child{border-top:0}
.seek .st{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;margin-left:6px}
.gate{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate .card{max-width:520px;margin:24px auto}
/* Wertung */
.score{display:grid;grid-template-columns:1fr repeat(4,56px) 54px;gap:4px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.score input{padding:4px;text-align:center;font-size:14px}
.score .h{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700}
.score .tot{font-family:var(--display);font-weight:800;font-size:16px;text-align:right}
@media (max-width:480px){.score{grid-template-columns:1fr repeat(4,46px) 46px;font-size:12px}.score input{font-size:13px;padding:3px}}
.sub-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="bg" id="heroBg"></div><div class="shade"></div>
  <div class="in">
    <span class="eyebrow">Junggesellenabschied</span>
    <h1>JGA Ferdi · Innsbruck</h1>
    <p>6. bis 8. Mai 2027 · Hütte, Bierpong, Tennis, Kneipentour</p>
    <div class="row between"><span class="count" id="countdown"></span><button class="me" id="meBtn">Ich bin …</button></div>
  </div>
</header>
<nav class="tabs"><div class="in" id="tabs">
  <button class="tab on" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button class="tab" data-tab="info"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>Hütte</button>
  <button class="tab" data-tab="eta"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Wie lange</button>
  <button class="tab" data-tab="tour"><svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-10 0z M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 12v4M8 20h8M9 16h6"/></svg>Bierpong</button>
  <button class="tab" data-tab="ibk"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 17l-2 4M16 17l2 4M8 7h.01M16 7h.01"/></svg>Innsbruck</button>
  <button class="tab" data-tab="lag"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L20 20M6 6l6 6M4.5 10.5l5-5"/></svg>LRG</button>

        : '<p class="muted">Der Nightliner 560N fährt nur in den Nächten Fr/Sa und Sa/So. Heute: Taxi.</p>'}

/* Wetter Innsbruck (Open-Meteo, kostenlos, ohne Schlüssel; Vorhersage erst ab ca. 16 Tage vorher) */
let wxCache = null, wxAt = 0;
async function loadWeather(){
  const box = () => $('#wx'); if(!box()) return;
  const draw = d => { const b = box(); if(!b) return; if(!d){ b.innerHTML = '<p class="muted" style="font-size:13px">Wetter für Innsbruck erscheint hier ab ca. 22. April 2027.</p>'; return; }
    const ic = c => c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌦️':c<=86?'🌨️':'⛈️';
    b.innerHTML = `<div class="wx">${d.time.map((t,i) => `<div class="d"><small>${['Do','Fr','Sa'][i]} ${t.slice(8)}.5.</small><div class="ic">${ic(d.weathercode[i])}</div><div class="t">${Math.round(d.temperature_2m_max[i])}°</div><small>${Math.round(d.temperature_2m_min[i])}° · Regen ${d.precipitation_probability_max[i] ?? '–'} %</small></div>`).join('')}</div><p class="muted" style="font-size:12px;margin-top:4px">Wetter Innsbruck, Open-Meteo</p>`; };
  if(wxCache && Date.now() - wxAt < 30*60000) return draw(wxCache);
  if(wxCache === false && Date.now() - wxAt < 30*60000) return draw(null);
  try{ const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.2692&longitude=11.4041&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&start_date=2027-05-06&end_date=2027-05-08'); const j = await r.json(); if(!j.daily) throw 0; wxCache = j.daily; wxAt = Date.now(); draw(wxCache); }
  catch(e){ wxCache = false; wxAt = Date.now(); draw(null); }
}

/* ---------- Karte ---------- */
let map = null, markers = [];
function renderMap(){
  const pts = Object.entries(D.schedule).map(([id,it]) => ({id, ...it})).filter(it => it.lat && it.lng);
  if(!$('#map')){
    main.innerHTML = `<p class="muted">Orte aus dem Zeitplan. Adresse beim Programmpunkt eintragen und „Auf Karte setzen“ drücken, dann erscheint der Punkt hier.</p><div id="map"></div><div class="legend" id="legend"></div><p class="muted" style="font-size:12px">Karte: © OpenStreetMap-Mitwirkende</p>`;
    map = L.map('map', {scrollWheelZoom:false}).setView([47.2692, 11.4041], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(map);
  }
  markers.forEach(m => m.remove()); markers = [];
  pts.forEach(it => { const m = L.marker([it.lat, it.lng]).addTo(map).bindPopup(`<strong>${esc(it.title)}</strong><br>${esc(it.place||'')}<br><a href="${mapsLink(it.addr||it.place, it.lat, it.lng)}" target="_blank" rel="noopener">Route</a>`); markers.push(m); });
  if(pts.length) map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])).pad(0.3), {maxZoom: 14});
  $('#legend').innerHTML = pts.map((it,i) => `<button class="btn small" data-pt="${i}">${esc(it.title)}</button>`).join('') || '';
  main.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { const m = markers[+b.dataset.pt]; map.setView(m.getLatLng(), 15); m.openPopup(); });
  setTimeout(() => map.invalidateSize(), 50);
}

/* ---------- Turniere: Bierpong und LRG (Tennis), gleiches Modul ---------- */
const TOURS = {
  tour: {label:'Bierpong', teams:'teams', results:'results', draw:'draw', note:'Auslosung am Donnerstag um 14:00 Uhr im Bus. Bis dahin müssen alle 8 Teams eingetragen sein.', champ:'Bierpong-Sieger'},
  lag:  {label:'LRG', teams:'tennisTeams', results:'tennisResults', draw:'tennisDraw', note:'Auslosung am Freitag um 10:00 Uhr beim Frühstück. Bis dahin müssen alle 8 Teams eingetragen sein.', champ:'LRG-Sieger'},
};
let T = TOURS.tour;
const TD = () => ({teams: D[T.teams] || {}, results: D[T.results] || {}, draw: D[T.draw]});
const TEAM_IDS = [1,2,3,4,5,6,7,8];
const GROUPS = {A:[1,2,3,4], B:[5,6,7,8]};
const GROUP_GAMES = {A:[['A1',1,2],['A2',3,4],['A3',1,3],['A4',2,4],['A5',1,4],['A6',2,3]], B:[['B1',5,6],['B2',7,8],['B3',5,7],['B4',6,8],['B5',5,8],['B6',6,7]]};
/* Teams melden sich selbst an (TD().teams, beliebige Schlüssel). Die Auslosung (TD().draw.slots) ordnet sie den Plätzen 1–8 zu:
   1–4 Gruppe A, 5–8 Gruppe B. Alle Tabellen und Spiele arbeiten mit Platznummern. */
const teamList = () => Object.entries(TD().teams).map(([id,t]) => ({id, ...t})).filter(t => (t.name||t.p1||t.p2)).sort((a,b) => (a.at||0)-(b.at||0));
const drawn = () => !!(TD().draw && TD().draw.slots);
const slotTeam = i => { const id = drawn() ? TD().draw.slots[i] : null; return id && TD().teams[id] ? TD().teams[id] : null; };
const REVEAL_MS = 900;
const revealed = i => !TD().draw || !TD().draw.at || (Date.now() - TD().draw.at) >= i * REVEAL_MS;
const teamName = i => { if(!revealed(i)) return '…'; const t = slotTeam(i); return (t && (t.name || t.p1)) || `Platz ${i}`; };
const teamSub = i => { if(!revealed(i)) return ''; const t = slotTeam(i) || {}; return t.name ? [t.p1, t.p2].filter(Boolean).join(' & ') : (t.p2 || ''); };
function result(gid){ const r = TD().results[gid]; if(!r || r.a == null || r.b == null || r.a === r.b) return null; return r; }
function standings(g){
  const st = {}; GROUPS[g].forEach(i => st[i] = {i, w:0, l:0, pf:0, pa:0});
  GROUP_GAMES[g].forEach(([gid,a,b]) => { const r = result(gid); if(!r) return; st[a].pf += r.a; st[a].pa += r.b; st[b].pf += r.b; st[b].pa += r.a; if(r.a > r.b){ st[a].w++; st[b].l++; } else { st[b].w++; st[a].l++; } });
  return Object.values(st).sort((x,y) => y.w - x.w || (y.pf-y.pa) - (x.pf-x.pa) || y.pf - x.pf || x.i - y.i);
}
function groupDone(g){ return GROUP_GAMES[g].every(([gid]) => result(gid)); }
function koTeams(){
  const A = standings('A'), B = standings('B'), ok = groupDone('A') && groupDone('B');
  const s1 = ok ? [A[0].i, B[1].i] : [null,null], s2 = ok ? [B[0].i, A[1].i] : [null,null];
  const r1 = result('S1'), r2 = result('S2');
  const win = (t, r) => r ? (r.a > r.b ? t[0] : t[1]) : null, lose = (t, r) => r ? (r.a > r.b ? t[1] : t[0]) : null;
  return {s1, s2, f: [win(s1,r1), win(s2,r2)], p3: [lose(s1,r1), lose(s2,r2)]};
}
function gameRow(gid, a, b, label){
  const r = TD().results[gid], done = result(gid);
  const nm = i => i ? teamName(i) : '<span class="muted">offen</span>';
  const open = openGame === gid;
  return `<div class="game" data-game="${gid}" ${a&&b?'':'style="cursor:default"'}>
    <div class="tm ${done && r.a > r.b ? 'w':''}">${nm(a)}</div>
    <div class="sc ${done?'':'open'}">${done ? `${r.a} : ${r.b}` : (a&&b ? 'Ergebnis' : '–')}</div>
    <div class="tm r ${done && r.b > r.a ? 'w':''}">${nm(b)}</div>
    ${label ? `<div class="sub">${label}</div>` : ''}
    ${open && a && b ? `<div class="scoreform"><input type="number" inputmode="numeric" min="0" max="20" id="sa" value="${r && r.a != null ? r.a : ''}" placeholder="0"><span class="muted">:</span><input type="number" inputmode="numeric" min="0" max="20" id="sb" value="${r && r.b != null ? r.b : ''}" placeholder="0">
      <div class="row between" style="grid-column:1/-1"><span class="muted" style="font-size:13px">Getroffene Becher je Team. Höhere Zahl gewinnt.</span><div class="row"><button class="btn small" id="sclear">Leeren</button><button class="btn small primary" id="ssave">Speichern</button></div></div></div>` : ''}
  </div>`;
}

/* ---------- Wie lange noch: GPS bis zur Hütte ---------- */
const OBERESSLINGEN = {lat: 48.7392, lng: 9.3272, name: 'Oberesslingen'};
/* Phasen: bis Do 17:00 Hinfahrt (Ziel Hütte), dann ausgeblendet, ab Sa 06:00 Rückfahrt (Ziel Oberesslingen) */
/* Hinfahrt endet nicht per Uhrzeit, sondern wenn jemand „Wir sind da“ drückt (oder ein Handy die Hütte auf 300 m erreicht); Rückfahrt ab Sa 06:00 */
function etaMode(){ const n = Date.now(); if(n >= new Date('2027-05-08T06:00:00+02:00').getTime()) return 'rueck'; if(D.settings.arrivedAt) return 'off'; return 'hin'; }
let START = OBERESSLINGEN;
const DEFAULT_DEST = {lat: 47.1311, lng: 11.5403, name: 'Peerhof Navis'};
const E = { pos: null, watch: null, err: null, route: null, routeAt: 0, total: null, busy: false };
const hutDest = () => { const d = D.settings.dest; if(d && d.lat) return d; const h = Object.values(D.schedule).find(it => /hütte/i.test(it.title||'') && it.lat); return h ? {lat: h.lat, lng: h.lng, name: h.place || 'Hütte'} : DEFAULT_DEST; };
const dest = () => etaMode() === 'rueck' ? OBERESSLINGEN : hutDest();
function syncEta(){ const mode = etaMode(); START = mode === 'rueck' ? {...hutDest(), name: 'Hütte'} : OBERESSLINGEN; const b = document.querySelector('.tab[data-tab="eta"]'); if(b) b.hidden = mode === 'off'; if(mode === 'off' && tab === 'eta'){ tab = 'plan'; ls.set('jga-tab', tab); } }
const hav = (a, b) => { const R = 6371, dl = (b.lat-a.lat)*Math.PI/180, dg = (b.lng-a.lng)*Math.PI/180, x = Math.sin(dl/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
async function osrm(a, b){ const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`); const j = await r.json(); if(!j.routes || !j.routes.length) throw new Error('keine Route'); return {km: j.routes[0].distance/1000, min: j.routes[0].duration/60}; }
function startGps(){
  if(E.watch != null || !navigator.geolocation) return;
  E.watch = navigator.geolocation.watchPosition(p => { E.pos = {lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now()}; E.err = null; if(etaMode() === 'hin' && hav(E.pos, hutDest()) < 0.3 && p.coords.accuracy < 200 && Date.now() > new Date('2027-05-06T00:00:00+02:00').getTime()) R('settings/arrivedAt').set(firebase.database.ServerValue.TIMESTAMP); updateRoute(); if(tab === 'eta') render(); },
    e => { E.err = e.code === 1 ? 'Standort nicht freigegeben. In den Browser-Einstellungen erlauben.' : 'Kein GPS-Signal.'; if(tab === 'eta') render(); }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}
async function updateRoute(){
  if(!E.pos || E.busy || Date.now() - E.routeAt < 60000) return;
  E.busy = true; const d = dest();
  try{ const key = START.lat+','+START.lng+'>'+d.lat+','+d.lng; if(!E.total || E.total.dest !== key){ const t = await osrm(START, d); E.total = {...t, dest: key}; } E.route = await osrm(E.pos, d); E.routeAt = Date.now(); }
  catch(e){ E.route = null; E.routeAt = Date.now(); }
  E.busy = false; if(tab === 'eta') render();
}
function renderEta(){
  startGps();
  const d = dest();
  const air = E.pos ? hav(E.pos, d) : null;
  const km = E.route ? E.route.km : air, min = E.route ? E.route.min : (air != null ? air / 80 * 60 : null);
  const totalKm = E.total ? E.total.km : hav(START, d) * 1.25;
  const frac = km != null ? Math.max(0, Math.min(1, 1 - km / totalKm)) : 0;
  const arrive = min != null ? new Date(Date.now() + min*60000).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) : null;
  const fmt = m => m < 60 ? `${Math.round(m)} Min.` : `${Math.floor(m/60)} h ${Math.round(m%60)} Min.`;
  const there = km != null && km < 1;
  main.innerHTML = `${etaMode() === 'rueck' ? '' : editBtn('Ziel ändern')}
    <div class="eta">
      <span class="eyebrow" style="color:rgba(255,255,255,.8)">${etaMode() === 'rueck' ? 'Heimfahrt · noch bis' : 'Noch bis'} ${esc(d.name)}</span>
      ${km != null ? `<div class="km">${km < 10 ? km.toFixed(1) : Math.round(km)}<small> km</small></div>
        <div class="sub">${E.route ? 'Fahrstrecke' : 'Luftlinie'} · ca. ${fmt(min)}</div>
        <div class="arr">Ankunft ca. ${arrive} Uhr</div>
        <div class="prog"><i style="width:${Math.round(frac*100)}%"></i></div><div class="lab"><span>${esc(START.name)}</span><span>${Math.round(frac*100)} %</span><span>${esc(d.name)}</span></div>`
      : `<div class="sub" style="padding:14px 0">${E.err ? esc(E.err) : 'Warte auf GPS …'}</div>`}
    </div>
    ${km != null ? `<div class="card yn">Sind wir schon da? ${there ? '<span style="color:var(--ok)">Ja!</span>' : '<span style="color:var(--bad)">Nein.</span>'}</div>` : ''}
    ${etaMode() === 'hin' ? `<div class="row" style="justify-content:center"><button class="btn" id="arrived">Wir sind da, Reiter ausblenden</button></div>` : ''}
    <p class="muted" style="font-size:13px">Standort nur auf diesem Handy, wird nicht gespeichert. Strecke über OSRM/OpenStreetMap, alle 60 Sekunden neu.${E.pos ? ` Genauigkeit ±${Math.round(E.pos.acc)} m.` : ''}</p>
    ${edit ? `<div class="card stack"><h3>Ziel</h3><p class="muted" style="font-size:14px">Aktuell: ${esc(d.name)} (${d.lat.toFixed(4)}, ${d.lng.toFixed(4)})</p>
      <div class="row"><input type="text" id="destAddr" class="grow" placeholder="Adresse der Hütte" value="${esc(D.settings.dest ? D.settings.dest.name : '')}"><button class="btn primary" id="destSet">Ziel setzen</button></div>
      <p class="muted" style="font-size:13px">Die Adresse gilt für alle. Wird auch im Plan beim Programmpunkt „Ankunft in der Hütte“ als Ort gesetzt, ist sie hier automatisch das Ziel.</p></div>` : ''}`;
  wireEdit();
  if($('#arrived')) $('#arrived').onclick = () => { const b = $('#arrived'); if(!b.dataset.armed){ b.dataset.armed = 1; b.textContent = 'Wirklich? Für alle Handys bis Samstag ausblenden'; return; } R('settings/arrivedAt').set(firebase.database.ServerValue.TIMESTAMP).then(() => { tab = 'plan'; ls.set('jga-tab', tab); render(); }); };
  if($('#destSet')) $('#destSet').onclick = async () => {
    const q = $('#destAddr').value.trim(); if(!q) return;
    $('#destSet').disabled = true;
    try{ const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), {headers:{'Accept-Language':'de'}}); const j = await r.json(); if(!j.length) throw new Error('Adresse nicht gefunden.');
      await R('settings/dest').set({lat: +j[0].lat, lng: +j[0].lon, name: q}); E.total = null; E.routeAt = 0; edit = false; toast('Ziel gesetzt: ' + j[0].display_name.split(',').slice(0,2).join(',')); updateRoute(); }
    catch(e){ toast(e.message, true); $('#destSet').disabled = false; }
  };
}

    <section class="card stack"><div class="sub-h"><h2>Teamwertung</h2><span class="muted" style="font-size:13px">Quiz · Bierpong · LRG</span></div>

        ${ranked.map(t => `<span style="overflow-wrap:anywhere">${esc(t.label)}</span>${CATS.map(([k]) => `<input type="number" inputmode="numeric" data-tscore="${t.id}" data-cat="${k}" value="${(D.teamScores[t.id]||{})[k] ?? ''}" placeholder="0">`).join('')}<span class="tot">${t.total}</span>`).join('')}</div>
        <p class="muted" style="font-size:13px">Punkte je Disziplin, z. B. 8 für Platz 1 bis 1 für Platz 8. Wird beim Tippen gespeichert.</p>`
      : ranked.map((t,i) => { if(t.total !== prev){ pos = i+1; prev = t.total; } return `<div class="rank ${pos<=3?'top':''}"><span class="pos">${pos}.</span><span><strong>${esc(t.label)}</strong><div class="muted" style="font-size:12px">${esc(t.sub)}${t.sub ? ' · ' : ''}${CATS.filter(([k]) => (D.teamScores[t.id]||{})[k]).map(([k,l]) => `${l} ${(D.teamScores[t.id]||{})[k]}`).join(' · ') || 'noch keine Punkte'}</div></span><span style="font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums">${t.total}</span></div>`; }).join(''))
      : '<p class="muted">Sobald Teams beim Bierpong eingetragen sind, erscheinen sie hier.</p>'}
    </section>`;
  wireEdit();
  main.querySelectorAll('[data-tscore]').forEach(inp => inp.oninput = () => { const p = 'teamScores/' + inp.dataset.tscore + '/' + inp.dataset.cat; saveSoon(p, p, inp.value === '' ? null : +inp.value); });
}

/* ---------- Musik: Playlist-Wünsche und Umfragen ---------- */
function renderMusik(){
  const songs = Object.entries(D.songs).map(([id,w]) => ({id, ...w})).sort((a,b) => (b.at||0)-(a.at||0));
  const polls = Object.entries(D.polls).map(([id,w]) => ({id, ...w})).sort((a,b) => (b.at||0)-(a.at||0));
  main.innerHTML = `${editBtn()}
    <section class="card stack"><div class="sub-h"><h2>Playlist-Wünsche</h2><span class="muted" style="font-size:13px">für Bus und Hütte</span></div>
      ${songs.map(x => `<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><div class="grow"><strong>${esc(x.title)}</strong>${x.artist ? ` <span class="muted">· ${esc(x.artist)}</span>` : ''}<div class="muted" style="font-size:12px">${esc(x.by||'')}</div></div>${edit ? `<button class="btn small danger" data-sdel="${x.id}">✕</button>` : ''}</div>`).join('') || '<p class="muted">Noch keine Wünsche.</p>'}
      <div class="editrow"><input type="text" id="songT" placeholder="Titel" maxlength="60"><input type="text" id="songA" placeholder="Interpret" maxlength="60"></div><div><button class="btn primary small" id="songAdd">+ Wunsch</button></div>
    </section>
    <section class="card stack"><div class="sub-h"><h2>Umfragen</h2></div>
      ${polls.map(pl => { const opts = pl.options || []; const votes = pl.votes || {}; const n = Object.keys(votes).length; const cnt = opts.map((_,i) => Object.values(votes).filter(v => v === i).length); const mine = votes[DEVICE];
        return `<div class="poll"><div class="row between"><strong>${esc(pl.q)}</strong><span class="muted" style="font-size:12px">${n} Stimme${n===1?'':'n'}${pl.closed ? ' · beendet' : ''}</span></div>
          ${opts.map((o,i) => `<div class="opt ${mine===i?'mine':''}" data-vote="${pl.id}" data-i="${i}"><div class="fill" style="width:${n ? 100*cnt[i]/n : 0}%"></div><span>${esc(o)}</span><span>${cnt[i]}</span></div>`).join('')}
          ${edit ? `<div class="row" style="margin-top:6px"><button class="btn small" data-pclose="${pl.id}">${pl.closed ? 'Wieder öffnen' : 'Beenden'}</button><button class="btn small danger" data-pdel="${pl.id}">Löschen</button></div>` : ''}</div>`; }).join('') || '<p class="muted">Noch keine Umfrage.</p>'}
      <div class="stack" style="gap:6px;margin-top:6px"><input type="text" id="pollQ" placeholder="Frage, z. B. Pizza oder Burger?" maxlength="100"><input type="text" id="pollO" placeholder="Antworten, mit Komma getrennt" maxlength="200"><div><button class="btn primary small" id="pollAdd">+ Umfrage</button></div></div>
    </section>`;
  wireEdit();
  $('#songAdd').onclick = () => { const t = $('#songT').value.trim(); if(!t) return; R('songs/' + uid()).set({title: t, artist: $('#songA').value.trim(), by: who(), at: firebase.database.ServerValue.TIMESTAMP}); };
  main.querySelectorAll('[data-sdel]').forEach(b => b.onclick = () => R('songs/' + b.dataset.sdel).remove());
  $('#pollAdd').onclick = () => { const q = $('#pollQ').value.trim(), o = $('#pollO').value.split(',').map(x => x.trim()).filter(Boolean); if(!q || o.length < 2) return toast('Frage und mindestens zwei Antworten eintragen.', true); R('polls/' + uid()).set({q, options: o, votes: {}, at: firebase.database.ServerValue.TIMESTAMP}); };
  main.querySelectorAll('[data-vote]').forEach(o => o.onclick = () => { const pl = D.polls[o.dataset.vote]; if(!pl || pl.closed) return; R('polls/' + o.dataset.vote + '/votes/' + DEVICE).set(+o.dataset.i); });
  main.querySelectorAll('[data-pclose]').forEach(b => b.onclick = () => R('polls/' + b.dataset.pclose + '/closed').set(!(D.polls[b.dataset.pclose]||{}).closed));
  main.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => R('polls/' + b.dataset.pdel).remove());
}

/* ---------- Orga: Kasse, Teilnehmer ---------- */
const eur = n => (Math.round(n*100)/100).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';
function settlement(){
  const people = peopleList(); if(!people.length) return {bal: [], moves: []};
  const bal = {}; people.forEach(p => bal[p.name] = 0);
  const ex = Object.values(D.expenses);
  for(const e of ex){ const amt = +e.amount || 0; if(!amt) continue; const sharers = (e.forAll === false && e.for && e.for.length) ? e.for : people.map(p => p.name); if(!(e.payer in bal)) bal[e.payer] = 0; bal[e.payer] += amt; sharers.forEach(n => { if(!(n in bal)) bal[n] = 0; bal[n] -= amt / sharers.length; }); }
  const cred = Object.entries(bal).filter(([,v]) => v > 0.005).map(([n,v]) => ({n, v})).sort((a,b) => b.v - a.v);
  const debt = Object.entries(bal).filter(([,v]) => v < -0.005).map(([n,v]) => ({n, v: -v})).sort((a,b) => b.v - a.v);
  const moves = []; let i = 0, j = 0;
  while(i < debt.length && j < cred.length){ const m = Math.min(debt[i].v, cred[j].v); moves.push({from: debt[i].n, to: cred[j].n, amt: m}); debt[i].v -= m; cred[j].v -= m; if(debt[i].v < 0.005) i++; if(cred[j].v < 0.005) j++; }
  return {bal: Object.entries(bal).map(([n,v]) => ({n, v})).sort((a,b) => b.v - a.v), moves, total: ex.reduce((a,e) => a + (+e.amount||0), 0)};
}
function renderOrga(){
  const people = peopleList();
  const ex = Object.entries(D.expenses).map(([id,e]) => ({id, ...e})).sort((a,b) => (b.at||0)-(a.at||0));
  const st = settlement();
  const names = people.map(p => p.name);
  main.innerHTML = `${editBtn()}
    <section class="card stack"><div class="sub-h"><h2>Kasse</h2><span class="muted" style="font-size:13px">${eur(st.total||0)} gesamt</span></div>
      ${st.moves.length ? `<div class="stack" style="gap:6px">${st.moves.map(m => `<div class="settle"><strong>${esc(m.from)}</strong> zahlt <strong>${eur(m.amt)}</strong> an <strong>${esc(m.to)}</strong></div>`).join('')}</div>` : '<p class="muted">Noch keine Ausgaben. Wer etwas auslegt, trägt es hier ein; die Umlage rechnet sich selbst.</p>'}
      ${st.bal.length && st.total ? `<details><summary class="muted" style="cursor:pointer;font-size:14px">Saldo je Person</summary><div class="bal" style="margin-top:8px">${st.bal.map(b => `<span>${esc(b.n)}</span><span class="${b.v>0.005?'pos':b.v<-0.005?'neg':''}">${b.v>0?'+':''}${eur(b.v)}</span>`).join('')}</div></details>` : ''}
      ${ex.length ? `<details ${edit?'open':''}><summary class="muted" style="cursor:pointer;font-size:14px">${ex.length} Ausgabe${ex.length===1?'':'n'}</summary>${ex.map(e => `<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><div class="grow"><strong>${esc(e.desc)}</strong><div class="muted" style="font-size:12px">${esc(e.payer)} · ${e.forAll === false && e.for ? 'für ' + esc(e.for.join(', ')) : 'für alle'}</div></div><strong style="font-variant-numeric:tabular-nums">${eur(+e.amount||0)}</strong>${edit ? `<button class="btn small danger" data-edel="${e.id}">✕</button>` : ''}</div>`).join('')}</details>` : ''}
      <div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:10px"><span class="eyebrow">Ausgabe eintragen</span>
        <div class="editrow"><input type="text" id="exDesc" placeholder="Wofür, z. B. Bus" maxlength="60"><input type="number" inputmode="decimal" step="0.01" id="exAmt" placeholder="Betrag in €"></div>
        <div class="editrow"><select id="exPayer">${names.map(n => `<option ${n===ME?'selected':''}>${esc(n)}</option>`).join('')}${names.length ? '' : '<option>Erst Teilnehmer eintragen</option>'}</select><select id="exFor"><option value="all">für alle</option><option value="some">nur für bestimmte …</option></select></div>
        <div class="row" id="exForList" hidden>${names.map(n => `<label class="btn small" style="cursor:pointer"><input type="checkbox" data-exfor="${esc(n)}" style="accent-color:var(--pine)"> ${esc(n)}</label>`).join('')}</div>
        <div><button class="btn primary small" id="exAdd" ${names.length?'':'disabled'}>+ Ausgabe</button></div></div>
    </section>
    <p class="muted" style="font-size:14px">Orga-Team: <a href="todo.html" style="color:var(--pine);font-weight:500">Orga-Liste öffnen</a> (wer übernimmt was, abhaken)</p>
    <section class="card stack"><div class="sub-h"><h2>Teilnehmer</h2><span class="muted" style="font-size:13px">${people.length} Personen</span></div>
      ${people.map(p => edit ? `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><input type="text" class="grow" data-person="${p.id}" data-k="name" value="${esc(p.name||'')}" placeholder="Name"><input type="text" class="grow" data-person="${p.id}" data-k="phone" value="${esc(p.phone||'')}" placeholder="Handy" inputmode="tel"><button class="btn small danger" data-pdel2="${p.id}">✕</button></div>`
        : `<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><strong>${esc(p.name)}${p.nick ? ` <span class="muted" style="font-weight:400">„${esc(p.nick)}“</span>` : ''}</strong>${p.phone ? `<span style="font-variant-numeric:tabular-nums;user-select:all">${esc(p.phone)}</span>` : ''}</div>`).join('') || '<p class="muted">Noch niemand eingetragen.</p>'}
      <div class="row"><input type="text" id="personNew" class="grow" placeholder="Name" maxlength="20"><button class="btn primary" id="personAdd">+</button></div>
      <p class="muted" style="font-size:13px">Handynummer über „Bearbeiten“ ergänzen.</p>
    </section>
`;
  wireEdit();
  $('#exFor').onchange = () => { $('#exForList').hidden = $('#exFor').value !== 'some'; };
  $('#exAdd').onclick = () => { const desc = $('#exDesc').value.trim(), amount = parseFloat(String($('#exAmt').value).replace(',', '.')); if(!desc || !(amount > 0)) return toast('Beschreibung und Betrag eintragen.', true);
    const some = $('#exFor').value === 'some'; const forList = Array.from(main.querySelectorAll('[data-exfor]:checked')).map(c => c.dataset.exfor); if(some && !forList.length) return toast('Für wen? Mindestens eine Person anhaken.', true);
    R('expenses/' + uid()).set({desc, amount, payer: $('#exPayer').value, forAll: !some, for: some ? forList : null, at: firebase.database.ServerValue.TIMESTAMP}).then(() => toast('Eingetragen')).catch(e => toast(e.message, true)); };
  main.querySelectorAll('[data-edel]').forEach(b => b.onclick = () => { if(b.dataset.armed){ R('expenses/' + b.dataset.edel).remove(); return; } b.dataset.armed = 1; b.textContent = 'Sicher?'; });
  $('#personAdd').onclick = () => { const n = $('#personNew').value.trim(); if(!n) return; if(people.some(p => (p.name||'').toLowerCase() === n.toLowerCase())) return toast('Gibt es schon.', true); R('people/' + uid()).set({name: n, at: firebase.database.ServerValue.TIMESTAMP}); };
  main.querySelectorAll('[data-person]').forEach(inp => inp.oninput = () => { const p = 'people/' + inp.dataset.person + '/' + inp.dataset.k; saveSoon(p, p, inp.value.trim()); });
  main.querySelectorAll('[data-pdel2]').forEach(b => b.onclick = () => { if(b.dataset.armed){ R('people/' + b.dataset.pdel2).remove(); return; } b.dataset.armed = 1; b.textContent = 'Sicher?'; });
}

/* ---------- Hütte: Bilder und Infos ---------- */
function renderInfo(){
  const photos = Object.entries(D.photos).map(([id,p]) => ({id, ...p})).sort((a,b) => (a.at||0)-(b.at||0));
  const infos = Object.entries(D.info).map(([id,p]) => ({id, ...p})).sort((a,b) => (a.order||0)-(b.order||0));
  const heroId = D.settings.heroPhoto || (photos[0] && photos[0].id);
  main.innerHTML = `${editBtn()}
    <section class="stack"><div class="row between"><h2>Unsere Hütte</h2><div><button class="btn small primary" id="addPhoto">+ Fotos</button><input type="file" id="photoFile" accept="image/*" multiple hidden></div></div>
      <div class="gallery">${photos.map(p => `<figure class="${p.id===heroId?'hero-pick':''}"><img src="${p.img}" alt="${esc(p.caption||'')}" loading="lazy">${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ''}${edit ? `<div class="acts"><button class="btn" data-hero="${p.id}" title="Als Titelbild">★</button><button class="btn" data-pdel="${p.id}" title="Löschen">✕</button></div>` : ''}</figure>`).join('') || '<p class="muted">Noch keine Fotos. Lade Bilder von der Hütte hoch; das erste wird zum Titelbild.</p>'}</div>
      ${edit && photos.length ? '<p class="muted" style="font-size:13px">★ macht ein Foto zum Titelbild oben.</p>' : ''}
    </section>
    <section class="card stack"><h3>Taxis für den Heimweg</h3><div class="taxi">${TAXIS.map(([n,t,w]) => `<div>${esc(n)}<small>${esc(w)}</small></div><a href="tel:${t.replace(/\s/g,'')}">${esc(t)}</a>`).join('')}</div><p class="muted" style="font-size:12px">Nummern aus Online-Verzeichnissen (Okt. 2026), vor der Fahrt kurz prüfen. Großraumtaxi für 8 Personen rechtzeitig vorbestellen. Nachts Fr/Sa: Nightliner 560N Innsbruck → Matrei (ca. 1, 2, 3 Uhr), dann Taxi ins Navistal.</p></section>
    <section class="stack">${infos.map(b => edit ? `<div class="card stack" data-info="${b.id}"><input type="text" data-ik="title" value="${esc(b.title)}" placeholder="Überschrift"><textarea data-ik="text" placeholder="Text">${esc(b.text||'')}</textarea><div class="row between"><span class="muted" style="font-size:13px">Wird beim Verlassen des Felds gespeichert</span><button class="btn small danger" data-idel="${b.id}">Löschen</button></div></div>`
      : `<div class="card infoblock"><h3>${esc(b.title)}</h3><div class="txt">${linkify(b.text||'')}</div></div>`).join('')}
      ${edit ? `<div><button class="btn small primary" id="addInfo">+ Infoblock</button></div>` : ''}
    </section>`;
  wireEdit();
  $('#addPhoto').onclick = () => $('#photoFile').click();
  $('#photoFile').onchange = async e => { const files = Array.from(e.target.files); if(!files.length) return; toast(`${files.length} Foto${files.length===1?'':'s'} werden hochgeladen …`); for(const f of files){ try{ const img = await compressImage(f, 1400); await R('photos/' + uid()).set({img, caption:'', at: firebase.database.ServerValue.TIMESTAMP}); }catch(err){ toast(err.message, true); } } toast('Fotos gespeichert'); };
  main.querySelectorAll('[data-hero]').forEach(b => b.onclick = () => R('settings/heroPhoto').set(b.dataset.hero));
  main.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => { if(b.dataset.armed){ R('photos/' + b.dataset.pdel).remove(); return; } b.dataset.armed = 1; b.textContent = 'Sicher?'; });
  main.querySelectorAll('[data-info] [data-ik]').forEach(inp => inp.oninput = () => { const p = 'info/' + inp.closest('[data-info]').dataset.info + '/' + inp.dataset.ik; saveSoon(p, p, inp.value); });
  main.querySelectorAll('[data-idel]').forEach(b => b.onclick = () => { if(b.dataset.armed){ R('info/' + b.dataset.idel).remove(); return; } b.dataset.armed = 1; b.textContent = 'Wirklich löschen?'; });
  if($('#addInfo')) $('#addInfo').onclick = () => R('info/' + uid()).set({title:'Neuer Block', text:'', order: Date.now()});
}

if(tab === 'fun') tab = 'musik';
render();
</script>
